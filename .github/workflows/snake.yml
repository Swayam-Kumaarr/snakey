name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day, 00:00 UTC
  workflow_dispatch:       # manual "Run workflow" button
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        run: |
          find src -name "*.java" > sources.txt
          mkdir -p out dist
          javac -cp lib/gson-2.11.0.jar -d out @sources.txt

      - name: Generate snake.gif from live contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: java -cp "out:lib/gson-2.11.0.jar" com.swayam.snake.App "${{ github.repository_owner }}" dist/snake.gif

      - name: Publish to the output branch
        run: |
          cd dist
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.gif
          git commit -m "update snake"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
